<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Jéssica Tozzi Confeitaria
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================================
         CABEÇALHO
         ================================================= -->

    <header class="cabecalho">

        <div
    class="logo"
    id="logo-estabelecimento">
</div>


        <h1 id="nome-estabelecimento">
        </h1>


        <p id="descricao-estabelecimento">
        </p>

    </header>



    <!-- =================================================
         CARDÁPIO
         ================================================= -->

    <main id="cardapio">


        <!-- =================================================
             CATEGORIAS
             ================================================= -->

        <nav
            class="categorias"
            id="categorias">

            <!--
                As categorias serão criadas
                automaticamente pelo JavaScript.
            -->

        </nav>


        <!-- =================================================
             PRODUTOS
             ================================================= -->

        <div id="lista-produtos">

            <!--
                Os produtos serão criados
                automaticamente pelo JavaScript.
            -->

        </div>


    </main>



    <!-- =================================================
         CARRINHO
         ================================================= -->

    <div
        class="carrinho-resumo"
        id="abrir-carrinho">

        <span class="carrinho-quantidade">
            🛒 0 itens
        </span>

        <strong class="carrinho-total">
            R$ 0,00
        </strong>

    </div>



    <!-- =================================================
         PAINEL DO CARRINHO
         ================================================= -->

    <div
        class="carrinho-painel"
        id="carrinho-painel">


        <div class="carrinho-cabecalho">

            <h2>
                Seu pedido
            </h2>


            <button
                class="fechar-carrinho"
                id="fechar-carrinho">

                ×

            </button>

        </div>


        <div
            class="carrinho-produtos"
            id="carrinho-produtos">

            <!--
                Produtos adicionados ao carrinho
                aparecerão aqui.
            -->

        </div>


        <div class="carrinho-rodape">


            <div class="carrinho-total-final">

                <span>
                    Total
                </span>

                <strong id="carrinho-total-final">
                    R$ 0,00
                </strong>

            </div>


            <button
                class="botao-finalizar"
                id="botao-finalizar">

                Finalizar pedido

            </button>


        </div>

    </div>



    <!-- =================================================
         CHECKOUT
         ================================================= -->

    <div
        class="checkout"
        id="checkout">


        <div class="checkout-conteudo">


            <div class="checkout-cabecalho">

                <h2>
                    Finalizar pedido
                </h2>


                <button
                    class="fechar-checkout"
                    id="fechar-checkout">

                    ×

                </button>

            </div>



            <form id="form-checkout">


                <div class="campo">

                    <label for="nome">
                        Seu nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>



                <div class="campo">

                    <label>
                        Como deseja receber?
                    </label>


                    <div class="opcoes-pedido">

                        <label class="opcao">

                            <input
                                type="radio"
                                name="tipo-pedido"
                                value="entrega"
                                checked
                            >

                            Entrega

                        </label>


                        <label class="opcao">

                            <input
                                type="radio"
                                name="tipo-pedido"
                                value="retirada"
                            >

                            Retirada

                        </label>

                    </div>

                </div>



<div
    class="campo"
    id="campo-endereco">

    <label for="rua">
        Rua
    </label>

    <input
        type="text"
        id="rua"
        placeholder="Nome da rua"
    >

    <label for="numero">
        Número
    </label>

    <input
        type="text"
        id="numero"
        placeholder="Número da casa"
    >

    <label for="bairro">
        Bairro
    </label>

    <input
        type="text"
        id="bairro"
        placeholder="Nome do bairro"
    >

    <label for="cidade">
        Cidade
    </label>

    <input
        type="text"
        id="cidade"
        placeholder="Nome da cidade"
    >

    <label for="referencia">
        Ponto de referência
    </label>

    <input
        type="text"
        id="referencia"
        placeholder="Ex.: próximo à praça"
    >

</div>



                <div class="campo">

                    <label for="pagamento">
                        Forma de pagamento
                    </label>


                    <select id="pagamento">

                        <option value="">
                            Selecione
                        </option>

                        <option value="Pix">
                            Pix
                        </option>

                        <option value="Dinheiro">
                            Dinheiro
                        </option>

                        <option value="Cartão de crédito">
                            Cartão de crédito
                        </option>

                        <option value="Cartão de débito">
                            Cartão de débito
                        </option>

                    </select>

                </div>



                <div
                    class="campo"
                    id="campo-troco">

                    <label for="troco">
                        Troco para quanto?
                    </label>

                    <input
                        type="text"
                        id="troco"
                        placeholder="Ex.: R$ 100,00"
                    >

                </div>



                <div class="campo">

                    <label for="observacao">
                        Observação
                    </label>

                    <textarea
                        id="observacao"
                        rows="3"
                        placeholder="Alguma observação sobre o pedido?"
                    ></textarea>

                </div>



                <div class="checkout-total">

                    <span>
                        Total do pedido
                    </span>

                    <strong id="checkout-total">
                        R$ 0,00
                    </strong>

                </div>



                <button
                    type="submit"
                    class="botao-enviar-pedido">

                    Continuar para o WhatsApp

                </button>


            </form>

        </div>

    </div>



    <!-- =================================================
         MODAL DE PRODUTO
         ================================================= -->

<div
    class="modal-produto"
    id="modal-produto">

    <div class="modal-produto-conteudo">

        <div class="modal-produto-cabecalho">

            <h2 id="modal-produto-nome">
                Produto
            </h2>

            <button
                type="button"
                id="fechar-modal-produto"
                class="fechar-modal-produto">
                ×
            </button>

        </div>


        <p
            class="modal-produto-descricao"
            id="modal-produto-descricao">
        </p>


        <div
            class="opcoes-produto"
            id="opcoes-tamanhos">
        </div>


        <div
            class="opcoes-produto"
            id="opcoes-adicionais">
        </div>


        <div class="modal-produto-total">

            <span>
                Total
            </span>

            <strong id="modal-produto-total">
                R$ 45,00
            </strong>

        </div>


        <button
            type="button"
            id="confirmar-produto"
            class="confirmar-produto">

            Adicionar ao carrinho

        </button>

    </div>

</div>



    <!-- =================================================
         JAVASCRIPT
         ================================================= -->

    <script src="dados.js"></script>

    <script src="script.js"></script>


</body>

</html>
